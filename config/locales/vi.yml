      name: 'Dialogflow'
      description: 'Xây dựng chatbot với Dialogflow và dễ dàng tích hợp chúng vào hộp thư đến của bạn. Các bot này có thể xử lý các truy vấn ban đầu trước khi chuyển tiếp cho nhân viên hỗ trợ khách hàng.'
    google_translate:
      name: 'Google Translate'
      description: 'Tích hợp Google Translate để giúp nhân viên dễ dàng dịch tin nhắn của khách hàng. Tích hợp này tự động phát hiện ngôn ngữ và chuyển đổi sang ngôn ngữ ưa thích của nhân viên hoặc quản trị viên.'
    openai:
      name: 'OpenAI'
      description: 'Tận dụng sức mạnh của các mô hình ngôn ngữ lớn từ OpenAI với các tính năng như gợi ý phản hồi, tóm tắt, diễn giải lại tin nhắn, kiểm tra chính tả và phân loại nhãn.'
    linear:
      name: 'Linear'
      description: 'Tạo vấn đề trong Linear trực tiếp từ cửa sổ trò chuyện của bạn. Hoặc liên kết các vấn đề hiện có trong Linear để quy trình theo dõi vấn đề trở nên hiệu quả và chuyên nghiệp hơn.'
    shopify:
      name: 'Shopify'
      description: 'Kết nối cửa hàng Shopify của bạn để truy cập chi tiết đơn hàng, thông tin khách hàng và dữ liệu sản phẩm trực tiếp trong các cuộc trò chuyện, giúp đội ngũ hỗ trợ của bạn cung cấp sự hỗ trợ nhanh chóng và có bối cảnh hơn cho khách hàng.'
