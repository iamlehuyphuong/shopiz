    slack:
      name: 'Slack'
      short_description: 'Nhận thông báo và trả lời cuộc trò chuyện trực tiếp trên Slack.'
      description: 'Tích hợp Shopiz với Slack để giữ cho đội ngũ của bạn đồng bộ. Tính năng này cho phép bạn nhận thông báo về các cuộc trò chuyện mới và trả lời trực tiếp từ giao diện của Slack.'
    webhooks:
      name: 'Webhooks'
      description: 'Sự kiện webhook cung cấp cập nhật thời gian thực về các hoạt động trong tài khoản Shopiz của bạn. Bạn có thể đăng ký các sự kiện ưa thích, và Shopiz sẽ gửi cho bạn các callback HTTP với các cập nhật.'
    dialogflow:
      name: 'Dialogflow'
      short_description: 'Xây dựng chatbot để xử lý các truy vấn ban đầu trước khi chuyển cho nhân viên.'
      description: 'Xây dựng chatbot với Dialogflow và dễ dàng tích hợp chúng vào hộp thư đến của bạn. Những bot này có thể xử lý các truy vấn ban đầu trước khi chuyển cho nhân viên hỗ trợ khách hàng.'
    google_translate:
      name: 'Google Translate'
      short_description: 'Tự động dịch tin nhắn của khách hàng cho nhân viên hỗ trợ.'
      description: 'Tích hợp Google Translate để giúp nhân viên dễ dàng dịch tin nhắn của khách hàng. Tính năng này tự động nhận diện ngôn ngữ và chuyển đổi sang ngôn ngữ ưu thích của nhân viên hoặc quản trị viên.'
    openai:
      name: 'OpenAI'
      short_description: 'Gợi ý trả lời, tóm tắt và cải thiện tin nhắn dựa trên AI.'
      description: 'Khai thác sức mạnh của các mô hình ngôn ngữ lớn từ OpenAI với các tính năng như gợi ý trả lời, tóm tắt, diễn đạt lại tin nhắn, kiểm tra chính tả và phân loại nhãn.'
    linear:
      name: 'Linear'
      short_description: 'Tạo và liên kết các vấn đề Linear trực tiếp từ cuộc trò chuyện.'
      description: 'Tạo vấn đề trong Linear trực tiếp từ cửa sổ cuộc trò chuyện của bạn. Hoặc liên kết các vấn đề Linear hiện có để quá trình theo dõi trở nên liền mạch và hiệu quả hơn.'
    shopify:
      name: 'Shopify'
      short_description: 'Truy cập chi tiết đơn hàng và dữ liệu khách hàng từ cửa hàng Shopify của bạn.'
      description: 'Kết nối cửa hàng Shopify của bạn để truy cập chi tiết đơn hàng, thông tin khách hàng và dữ liệu sản phẩm trực tiếp trong cuộc trò chuyện, giúp đội ngũ hỗ trợ của bạn cung cấp hỗ trợ nhanh chóng và có bối cảnh hơn cho khách hàng.'
    leadsquared:
      name: 'LeadSquared'
      short_description: 'Đồng bộ hóa danh bạ và cuộc trò chuyện của bạn với CRM LeadSquared.'
      description: 'Đồng bộ hóa danh bạ và cuộc trò chuyện của bạn với CRM LeadSquared. Tính năng này tự động tạo khách hàng tiềm năng trong LeadSquared khi danh bạ mới được thêm và lưu lại các hoạt động cuộc trò chuyện để cung cấp bối cảnh đầy đủ cho đội ngũ bán hàng của bạn.'
