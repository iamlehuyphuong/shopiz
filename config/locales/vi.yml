      description: 'Tích hợp Shopiz với Slack để giữ cho nhóm của bạn luôn được cập nhật. Tích hợp này cho phép bạn nhận thông báo về những cuộc trò chuyện mới và phản hồi trực tiếp trong giao diện của Slack.'
