        messages. This integration automatically detects the language and converts
        it to the agent's or admin's preferred language.
    openai:
      name: OpenAI
      short_description: AI-powered reply suggestions, summarization, and message
        enhancement.
      description: Leverage the power of large language models from OpenAI with the
        features such as reply suggestions, summarization, message rephrasing, spell-checking,
        and label classification.
    linear:
      name: Linear
      short_description: Create and link Linear issues directly from conversations.
      description: Create issues in Linear directly from your conversation window.
        Alternatively, link existing Linear issues for a more streamlined and efficient
        issue tracking process.
    notion:
