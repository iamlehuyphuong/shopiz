---
- id: add_contact_note
  title: Add Contact Note (Thêm ghi chú khách hàng)
  description: Add a note to a contact profile (Thêm ghi chú vào hồ sơ khách hàng)
  icon: note-add
- id: add_private_note
  title: Add Private Note (Thêm ghi chú nội bộ)
  description: Add a private note to a conversation [internal only] (Thêm ghi chú
    nội bộ vào cuộc hội thoại)
  icon: eye-off
- id: update_priority
  title: Update Priority (Cập nhật độ ưu tiên)
  description: Update conversation priority level (Cập nhật mức độ ưu tiên của hội
    thoại)
  icon: exclamation-triangle
- id: add_label_to_conversation
  title: Add Label (Gắn nhãn hội thoại)
  description: Add a label to a conversation (Gắn một nhãn vào cuộc hội thoại)
  icon: tag
- id: add_interactive_message_to_conversation
  title: Send Interactive Message (Gửi tin nhắn tương tác)
  description: Add an interactive message to a conversation (Gửi một tin nhắn tương
    tác như Nút bấm/Danh sách vào cuộc hội thoại)
  icon: tag
- id: faq_lookup
  title: FAQ Lookup (Tra cứu FAQ)
  description: Search FAQ responses using semantic similarity (Tìm kiếm câu trả lời
    từ tài liệu tri thức bằng AI)
  icon: search
- id: resolve_conversation
  title: Resolve Conversation (Đóng hội thoại)
  description: Resolve a conversation when the issue has been addressed (Đánh dấu
    đóng hội thoại khi vấn đề đã được xử lý xong)
  icon: checkmark
- id: handoff
  title: Handoff to Human (Chuyển cho nhân viên)
  description: Hand off the conversation to a human agent (Chuyển cuộc trò chuyện
    cho nhân viên hỗ trợ)
  icon: user-switch
- id: assign_conversation
  title: Assign Conversation (Phân công hội thoại)
  description: Assign a conversation to a specific team or agent (Phân công hội thoại
    cho một nhóm hoặc nhân viên cụ thể)
  icon: people-team
- id: update_contact
  title: Update Contact (Cập nhật thông tin khách hàng)
  description: Update contact profile information (name, email, phone, custom attributes)
    (Cập nhật thông tin hồ sơ của khách hàng)
  icon: person-edit
- id: get_contact_detail
  title: Get Contact Details (Xem chi tiết khách hàng)
  description: Get detailed information about the current contact (Lấy thông tin chi
    tiết về khách hàng hiện tại)
  icon: person-info
- id: snooze_conversation
  title: Snooze Conversation (Tạm hoãn hội thoại)
  description: Snooze a conversation to follow up later (Tạm hoãn cuộc hội thoại để
    xử lý sau)
  icon: clock
- id: remove_label_from_conversation
  title: Remove Label (Gỡ nhãn hội thoại)
  description: Remove a label from a conversation (Gỡ bỏ một nhãn khỏi cuộc hội thoại)
  icon: tag-dismiss
- id: set_conversation_custom_attribute
  title: Set Custom Attributes (Cập nhật thuộc tính tùy chỉnh)
  description: Set or update custom attributes on a conversation (Cập nhật thông tin
    thuộc tính tùy chỉnh của hội thoại)
  icon: document-data
- id: search_previous_conversation
