custom_roles:
  - name: 'Trưởng nhóm Hỗ trợ Khách hàng'
    description: 'Nhân viên hỗ trợ trưởng với quyền quản lý hội thoại và liên hệ đầy đủ'
    permissions:
      - 'conversation_manage'
      - 'contact_manage'
      - 'report_manage'
  - name: 'Nhân viên Kinh doanh'
    description: 'Thành viên nhóm kinh doanh với quyền truy cập hội thoại và liên hệ'
    permissions:
      - 'conversation_unassigned_manage'
      - 'conversation_participating_manage'
      - 'contact_manage'
  - name: 'Quản lý Kiến thức'
    description: 'Quản lý kho kiến thức và tham gia hội thoại'
    permissions:
      - 'knowledge_base_manage'
      - 'conversation_participating_manage'
  - name: 'Nhân viên Mới'
    description: 'Nhân viên cấp đầu với quyền truy cập hội thoại cơ bản'
    permissions:
      - 'conversation_participating_manage'
  - name: 'Chuyên viên Phân tích'
    description: 'Tập trung vào báo cáo và phân tích dữ liệu'
    permissions:
      - 'report_manage'
      - 'conversation_participating_manage'
  - name: 'Nhân viên Xử lý Leo thang'
    description: 'Xử lý các hội thoại chưa được gán và các trường hợp leo thang'
    permissions:
      - 'conversation_unassigned_manage'
      - 'conversation_participating_manage'
      - 'contact_manage'
