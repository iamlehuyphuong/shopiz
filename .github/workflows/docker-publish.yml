name: Build and Publish Docker Image to GHCR

on:
  push:
    branches: [ "main", "master" ]
    # Chạy action khi bạn push code lên nhánh main hoặc master
  workflow_dispatch:
    # Cho phép bạn kích hoạt action này bằng tay trên giao diện GitHub

env:
  REGISTRY: ghcr.io
  # Tên image sẽ lấy theo định dạng: username/repository (ví dụ: iamlehuyphuong/shopiz)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    
    # Cấp quyền cho GitHub Actions có thể ghi image vào Packages
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN là biến môi trường có sẵn của GitHub, bạn không cần phải tự tạo
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          # Sẽ thực hiện push image lên registry
          push: true
          # Đặt tên tag là latest để khớp với cấu hình Dokploy của bạn
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
